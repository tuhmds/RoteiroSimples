name: Testes RS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  compilador:
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.14']
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar medidor de cobertura
        if: matrix.python == '3.11'
        run: python -m pip install -r verificacao/dependencias.txt
      - name: Testes de análise e execução nativa
        if: matrix.python != '3.11'
        run: python -m unittest discover -s testes -v
      - name: Testes com cobertura de linhas e ramos
        if: matrix.python == '3.11'
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
        run: python -m coverage run -m unittest discover -s testes -v
      - name: Campanha estruturada com oráculo independente
        if: matrix.python == '3.11'
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
        run: python -m coverage run -m verificacao.campanha --casos 12 --passos 40 --saida relatorios/campanha
      - name: Consolidar cobertura
        if: always() && matrix.python == '3.11'
        run: python -m verificacao.cobertura --saida relatorios
      - name: Medir laços de O0 a O8
        if: matrix.python == '3.11'
        run: python -m benchmarks.medir --repeticoes 17 --json relatorios/medicao-lacos.json
      - name: Medir funções escalares de O0 a O8
        if: matrix.python == '3.11'
        run: python -m benchmarks.medir --fonte benchmarks/funcoes_escalares_rs042j.rts --repeticoes 17 --json relatorios/medicao-funcoes.json
      - name: Medir fluxo e chamadas dentro de funções
        if: matrix.python == '3.11'
        run: python -m benchmarks.medir --fonte benchmarks/funcoes_fluxo_rs042l.rts --repeticoes 17 --json relatorios/medicao-funcoes-fluxo.json
      - name: Medir coleções de O0 a O8
        if: matrix.python == '3.11'
        run: python -m benchmarks.medir --fonte benchmarks/colecoes_rs042j.rts --repeticoes 3 --json relatorios/medicao-colecoes.json
      - name: Medir léxico escrito em RS com funções mistas
        if: matrix.python == '3.11'
        run: python -m benchmarks.medir --fonte benchmarks/lexico_rs042s.rts --repeticoes 17 --json relatorios/medicao-lexico-misto.json
      - name: Medir consultas de coleções com cálculo escalar
        if: matrix.python == '3.11'
        run: python -m benchmarks.medir --fonte benchmarks/colecoes_mistas_rs042s.rts --repeticoes 17 --json relatorios/medicao-colecoes-mistas.json
      - name: Medir biblioteca RS de textos e listas proprietárias
        if: matrix.python == '3.11'
        run: python -m benchmarks.medir --fonte benchmarks/textos_rs042t.rts --repeticoes 17 --json relatorios/medicao-textos.json
      - name: Medir crescimento da compilação em processos isolados
        if: matrix.python == '3.11'
        run: python -m benchmarks.crescimento --tamanhos 4,12 --repeticoes 2 --json relatorios/crescimento-compilacao.json
      - name: Conferir crescimento da compactação contra referência anterior
        if: matrix.python == '3.11'
        run: python -m benchmarks.saltos --tamanhos 128,512 --repeticoes 3 --comparar-legado --json relatorios/compactacao-saltos.json
      - name: Medir análise SSA contra referência anterior
        if: matrix.python == '3.11'
        run: python -m benchmarks.analise_ssa --referencia rs042q --tamanhos 32,128 --repeticoes 3 --json relatorios/analise-ssa.json
      - name: Guardar relatórios e casos de falha
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: consolidacao-${{ matrix.so }}-python-${{ matrix.python }}
          path: relatorios/
          if-no-files-found: error
